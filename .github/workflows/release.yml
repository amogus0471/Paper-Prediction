name: Release

# Publishes a zip anyone can download and load into Chrome without installing
# node, cloning the repo, or running a build.
#
# The alternative — committing dist/ — was rejected deliberately: build output
# in git goes stale the moment someone edits src and forgets, and then the
# thing people download is not the thing the code says it is. Built from a tag
# by CI, the artifact is always exactly what that tag compiles to.
on:
  push:
    tags: ['v*']
  # Also runnable by hand, so a zip can be produced without cutting a tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Never ship an artifact that has not passed the same gate a merge does.
      # A broken release is worse than no release: it is a broken release with
      # a download button on it.
      - name: Verify
        run: npm run verify

      - name: Package
        run: npm run pack --workspace @polyfill/extension

      - name: Confirm the zip is loadable
        run: |
          cd release
          unzip -t paper-predictions-*.zip
          unzip -o -q paper-predictions-*.zip -d _check
          test -f _check/manifest.json
          test -f _check/src/content/index.js
          node -e "JSON.parse(require('fs').readFileSync('_check/manifest.json','utf8'))"
          rm -rf _check

      - uses: actions/upload-artifact@v4
        with:
          name: paper-predictions-extension
          path: release/*.zip
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
          body: |
            ## Install — no build, no npm

            1. Download **`paper-predictions-*.zip`** from Assets below
            2. **Unzip it.** Right-click → Extract All on Windows, double-click on macOS
            3. Open `chrome://extensions`
            4. Turn on **Developer mode** — the toggle in the top right
            5. Click **Load unpacked** and pick the unzipped folder
            6. Open a market on Polymarket, Kalshi, Hyperliquid or Limitless

            ### Picking the right folder

            Chrome says *"Manifest file is missing or unreadable"* for several
            different mistakes, so it never tells you which one you made. The
            folder you select must have **`manifest.json` directly inside it**.

            Open the folder before you select it. If you see `manifest.json`
            next to `assets`, `icons` and `src`, that is the one. If you see
            another folder with the same name, go one level deeper — Windows
            wraps extracted files in a folder of their own.

            Do not select the `.zip` itself; Load unpacked only takes folders.
            And if you cloned the repo, do not select `apps/extension` — it has
            no `manifest.json` on purpose, so it cannot be loaded by mistake.

            Already running an older copy? Remove it first, or two panels will
            fight over the same page.

            ---

            You start with **P$10,000 of simulated money**. No sign-up, no
            account, no wallet. Nothing here can place a real order.
