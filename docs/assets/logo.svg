<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Paper Predictions">
  <!--
    The same mark the toolbar icon draws, as vector.

    A rounded frame holding three bars of decreasing width — solid, half, then
    outline only. It reads as an order book whose liquidity thins as you walk
    down it, which is the entire product: the fill you get depends on how far
    down that ladder your order has to reach.
  -->
  <defs>
    <linearGradient id="pp-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="#0B0D10"/>
  <rect x="18" y="18" width="92" height="92" rx="22" fill="none" stroke="url(#pp-edge)" stroke-width="6"/>

  <!-- top of book: full size, fills instantly -->
  <rect x="34" y="42" width="60" height="12" rx="3" fill="#60A5FA"/>

  <!-- one level down: thinner, and only partly there -->
  <rect x="34" y="60" width="46" height="12" rx="3" fill="none" stroke="#3B82F6" stroke-width="2.5"/>
  <rect x="36.25" y="62.25" width="23" height="7.5" fill="#3B82F6"/>

  <!-- the tail: an outline, because there is nothing behind it -->
  <rect x="34" y="78" width="30" height="12" rx="3" fill="none" stroke="#3B82F6" stroke-width="2.5" opacity="0.65"/>
</svg>
