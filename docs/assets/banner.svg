<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Paper Predictions — paper-trade real prediction markets">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141C"/>
      <stop offset="1" stop-color="#0B0D10"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- A real ladder, drawn to scale: each rung is a level and the widths are
       the sizes resting on it. Depth thins as you walk down, which is why a
       big order gets a worse average than the top-of-book price implies. -->
  <g transform="translate(760 54)">
    <rect x="0" y="0" width="360" height="192" rx="16" fill="#151A23" stroke="#222B38"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
      <g fill="#22C55E">
        <rect x="16" y="18"  width="150" height="18" rx="3" fill="#22C55E" opacity="0.16"/>
        <rect x="16" y="42"  width="104" height="18" rx="3" fill="#22C55E" opacity="0.13"/>
        <rect x="16" y="66"  width="66"  height="18" rx="3" fill="#22C55E" opacity="0.10"/>
        <text x="24" y="32">63¢   1,420</text>
        <text x="24" y="56">62¢     880</text>
        <text x="24" y="80">61¢     310</text>
      </g>
      <g fill="#EF4444">
        <rect x="16" y="104" width="132" height="18" rx="3" fill="#EF4444" opacity="0.15"/>
        <rect x="16" y="128" width="80"  height="18" rx="3" fill="#EF4444" opacity="0.12"/>
        <rect x="16" y="152" width="44"  height="18" rx="3" fill="#EF4444" opacity="0.09"/>
        <text x="24" y="118">64¢   1,100</text>
        <text x="24" y="142">65¢     540</text>
        <text x="24" y="166">66¢     120</text>
      </g>
    </g>
    <rect x="180" y="18" width="164" height="148" fill="url(#fade)"/>
  </g>

  <!-- mark -->
  <g transform="translate(84 86)">
    <rect width="128" height="128" rx="28" fill="#0B0D10" stroke="#1E2733"/>
    <rect x="18" y="18" width="92" height="92" rx="22" fill="none" stroke="url(#edge)" stroke-width="6"/>
    <rect x="34" y="42" width="60" height="12" rx="3" fill="#60A5FA"/>
    <rect x="34" y="60" width="46" height="12" rx="3" fill="none" stroke="#3B82F6" stroke-width="2.5"/>
    <rect x="36.25" y="62.25" width="23" height="7.5" fill="#3B82F6"/>
    <rect x="34" y="78" width="30" height="12" rx="3" fill="none" stroke="#3B82F6" stroke-width="2.5" opacity="0.65"/>
  </g>

  <g font-family="Inter, system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="248" y="132" fill="#E6EAF2" font-size="52" font-weight="800" letter-spacing="-0.5">Paper Predictions</text>
    <text x="250" y="170" fill="#8FA3BF" font-size="19">Practise on real markets, priced by the real order book.</text>
    <g transform="translate(250 194)">
      <rect width="238" height="26" rx="6" fill="none" stroke="#1D4ED8"/>
      <text x="14" y="18" fill="#93B4FD" font-size="12" font-weight="800" letter-spacing="1.4">SIMULATED · NO REAL MONEY</text>
    </g>
  </g>
</svg>
